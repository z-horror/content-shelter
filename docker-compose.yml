services:
  bot:
    build: .
    container_name: neuroslop-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/neuroslop.sqlite3
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
